<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 252" width="334" height="252" role="img" aria-label="VS Code editor in Light Modern theme, with the Explorer, an open TypeScript file, and the agent Sessions panel ready to start a session.">
  <defs>
    <clipPath id="frameClip"><rect x="0" y="0" width="334" height="252" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frameClip)" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">

    <!-- app background -->
    <rect x="0" y="0" width="334" height="252" fill="#ffffff"/>

    <!-- title bar -->
    <rect x="0" y="0" width="334" height="16" fill="#f8f8f8"/>
    <rect x="0" y="15.5" width="334" height="0.5" fill="#e5e5e5"/>
    <text x="167" y="11" font-size="7" fill="#3b3b3b" text-anchor="middle" font-weight="600">Visual Studio Code</text>

    <!-- explorer sidebar -->
    <rect x="0" y="16" width="80" height="224" fill="#f8f8f8"/>
    <rect x="79.5" y="16" width="0.5" height="224" fill="#e5e5e5"/>
    <text x="8" y="28" font-size="5.5" letter-spacing="0.5" fill="#6f6f6f" font-weight="600">EXPLORER</text>
    <path d="M4 38.5 L7 40.5 L4 42.5 Z" fill="#3b3b3b"/>
    <text x="12" y="41.5" font-size="6" fill="#3b3b3b" font-weight="600">VSCODE</text>

    <!-- tree rows -->
    <g font-size="6" fill="#3b3b3b">
      <rect x="10" y="47" width="7" height="7" fill="#dcb67a"/>
      <text x="21" y="53">.github</text>

      <rect x="10" y="58" width="7" height="7" fill="#dcb67a"/>
      <text x="21" y="64">build</text>

      <rect x="10" y="69" width="7" height="7" fill="#dcb67a"/>
      <text x="21" y="75">extensions</text>

      <path d="M8 82.5 L11 84.5 L8 86.5 Z" fill="#3b3b3b"/>
      <rect x="16" y="80" width="7" height="7" fill="#dcb67a"/>
      <text x="27" y="86">src</text>

      <path d="M20 93.5 L23 95.5 L20 97.5 Z" fill="#3b3b3b"/>
      <rect x="28" y="91" width="7" height="7" fill="#dcb67a"/>
      <text x="39" y="97">vs</text>

      <path d="M28 104.5 L31 106.5 L28 108.5 Z" fill="#3b3b3b"/>
      <rect x="36" y="102" width="7" height="7" fill="#dcb67a"/>
      <text x="47" y="108">workbench</text>

      <!-- selected file row -->
      <rect x="0" y="112" width="80" height="12" fill="#e8e8e8"/>
      <rect x="44" y="114.5" width="7" height="7" fill="#3178c6"/>
      <text x="55" y="120.5" fill="#0b3d91" font-weight="600">workbench.desktop.main.ts</text>
      <rect x="10" y="126" width="7" height="7" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
      <circle cx="11" cy="127" r="1" fill="#cbcb41"/>
      <text x="21" y="132">package.json</text>

      <rect x="10" y="137" width="7" height="7" fill="none" stroke="#8a8a8a" stroke-width="0.6"/>
      <circle cx="11" cy="138" r="1" fill="#cbcb41"/>
      <text x="21" y="143">product.json</text>
    </g>

    <path d="M4 149.5 L7 151.5 L4 153.5 Z" fill="#6f6f6f"/>
    <text x="12" y="152.5" font-size="5.5" fill="#6f6f6f" font-weight="600">OUTLINE</text>
    <path d="M4 160.5 L7 162.5 L4 164.5 Z" fill="#6f6f6f"/>
    <text x="12" y="163.5" font-size="5.5" fill="#6f6f6f" font-weight="600">TIMELINE</text>

    <!-- editor -->
    <rect x="80" y="16" width="174" height="11" fill="#ececec"/>
    <rect x="80" y="16" width="112" height="11" fill="#ffffff"/>
    <rect x="80" y="26.5" width="112" height="1.5" fill="#005fb8"/>
    <rect x="86" y="18.5" width="6" height="6" fill="#3178c6"/>
    <text x="96" y="24" font-size="5.5" fill="#3b3b3b">workbench.desktop.main.ts</text>
    <path d="M183 20 L187 24 M187 20 L183 24" stroke="#8a8a8a" stroke-width="0.7" stroke-linecap="round"/>

    <g font-family="Consolas, 'Courier New', monospace" font-size="6.5">
      <text x="88" y="42" fill="#999999" text-anchor="end">1</text>
      <text x="88" y="54" fill="#999999" text-anchor="end">2</text>
      <text x="88" y="66" fill="#999999" text-anchor="end">3</text>
      <text x="88" y="78" fill="#999999" text-anchor="end">4</text>
      <text x="88" y="90" fill="#999999" text-anchor="end">5</text>
      <text x="88" y="102" fill="#999999" text-anchor="end">6</text>
      <text x="88" y="114" fill="#999999" text-anchor="end">7</text>
      <text x="88" y="126" fill="#999999" text-anchor="end">8</text>
      <text x="88" y="138" fill="#999999" text-anchor="end">9</text>
      <text x="88" y="150" fill="#999999" text-anchor="end">10</text>

      <text x="94" y="42"><tspan fill="#0000ff">import</tspan><tspan fill="#3b3b3b"> "</tspan><tspan fill="#a31515">../workbench.common.main.js</tspan><tspan fill="#3b3b3b">";</tspan></text>
      <text x="94" y="54"><tspan fill="#0000ff">import</tspan><tspan fill="#3b3b3b"> main </tspan><tspan fill="#0000ff">from</tspan><tspan fill="#3b3b3b"> '</tspan><tspan fill="#a31515">./workbench.desktop.main.js</tspan><tspan fill="#3b3b3b">'</tspan></text>
      <text x="94" y="78" fill="#008000">// workbench (desktop main)</text>
      <text x="94" y="102"><tspan fill="#0000ff">import</tspan><tspan fill="#3b3b3b"> "</tspan><tspan fill="#a31515">../electron-browser/desktop.main.js</tspan><tspan fill="#3b3b3b">"</tspan></text>
      <text x="94" y="114" fill="#008000">// workbench parts</text>
      <text x="94" y="126"><tspan fill="#0000ff">import</tspan><tspan fill="#3b3b3b"> "</tspan><tspan fill="#a31515">../electron-browser/dialogs/dialog.contribution.js</tspan><tspan fill="#3b3b3b">"</tspan></text>
      <text x="94" y="150" fill="#008000">// workbench services</text>
    </g>

    <!-- sessions panel -->
    <rect x="254" y="16" width="80" height="224" fill="#f8f8f8"/>
    <rect x="254" y="16" width="0.5" height="224" fill="#e5e5e5"/>
    <text x="262" y="28" font-size="5.5" letter-spacing="0.5" fill="#6f6f6f" font-weight="600">SESSIONS</text>
    <path d="M323 25 v5 M320.5 27.5 h5" stroke="#6f6f6f" stroke-width="0.8" stroke-linecap="round"/>

    <circle cx="294" cy="108" r="13" fill="none" stroke="#005fb8" stroke-width="1.2"/>
    <circle cx="294" cy="98" r="2" fill="#005fb8"/>
    <circle cx="286" cy="114" r="2" fill="#005fb8"/>
    <circle cx="302" cy="114" r="2" fill="#005fb8"/>
    <path d="M294 100 L286 112 M294 100 L302 112" stroke="#005fb8" stroke-width="0.8"/>

    <text x="294" y="140" font-size="6.5" fill="#1f1f1f" font-weight="600" text-anchor="middle">Start an agent</text>
    <text x="294" y="149" font-size="6.5" fill="#1f1f1f" font-weight="600" text-anchor="middle">session</text>
    <text x="294" y="160" font-size="5" fill="#6f6f6f" text-anchor="middle">Describe what to build</text>
    <text x="294" y="167" font-size="5" fill="#6f6f6f" text-anchor="middle">with you.</text>

    <rect x="262" y="178" width="64" height="30" rx="3" fill="#ffffff" stroke="#d4d4d4" stroke-width="0.75"/>
    <text x="266" y="189" font-size="5" fill="#8a8a8a">Describe what to build</text>
    <path d="M267 202 l1.5 4 1.5 -2 1.5 2 1.5 -4" fill="none" stroke="#6f6f6f" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="278" y="199.5" width="5" height="6.5" rx="2.5" fill="none" stroke="#6f6f6f" stroke-width="0.7"/>
    <circle cx="320" cy="203" r="4.5" fill="#005fb8"/>
    <path d="M318 203 L322 203 M320.3 200.8 L322.5 203 L320.3 205.2" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- status bar -->
    <rect x="0" y="240" width="334" height="12" fill="#007acc"/>
    <path d="M6 244 v4 M6 244 q3 0 3 2 q0 2 -3 2 M6 246 h3" fill="none" stroke="#ffffff" stroke-width="0.6"/>
    <text x="14" y="248" font-size="5.5" fill="#ffffff">main</text>
    <text x="32" y="248" font-size="5.5" fill="#ffffff">0↑ 0↓</text>
    <text x="330" y="248" font-size="5" fill="#ffffff" text-anchor="end">Ln 12, Col 1  Spaces: 4  UTF-8  TypeScript</text>
  </g>
</svg>
